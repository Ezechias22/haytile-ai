# Local development only. Loopback bindings; never deploy trust authentication publicly.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: haytile
      POSTGRES_USER: haytile
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haytile -d haytile"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
volumes:
  pgdata:
  redisdata:
