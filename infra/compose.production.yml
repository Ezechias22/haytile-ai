# Provide TLS ingress separately. Do not use development trust authentication here.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: haytile
      POSTGRES_USER: haytile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a private database password}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haytile"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    restart: unless-stopped
  api:
    build: {context: .., dockerfile: infra/api.Dockerfile}
    env_file: ../.env.production
    environment:
      HAYTILE_ENV: production
      HAYTILE_DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["private-media:/data"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: {context: .., dockerfile: infra/api.Dockerfile}
    command: ["python", "-m", "haytile.worker"]
    env_file: ../.env.production
    environment:
      HAYTILE_ENV: production
      HAYTILE_DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
    volumes: ["private-media:/data"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  web:
    build: {context: .., dockerfile: infra/web.Dockerfile}
    environment: {HAYTILE_API_URL: "http://api:8000"}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  private-media:
